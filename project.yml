# XcodeGen fallback.
#
# The checked-in Praxis.xcodeproj should just open. If it ever gets into a bad
# state, delete it and regenerate from this file:
#
#   brew install xcodegen && xcodegen generate
#
name: Praxis
options:
  bundleIdPrefix: com.praxis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  Praxis:
    type: application
    platform: iOS
    sources:
      - path: Praxis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.praxis.tutor
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Praxis
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight

  PraxisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PraxisTests
    dependencies:
      - target: Praxis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.praxis.tutor.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Praxis:
    build:
      targets:
        Praxis: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PraxisTests
